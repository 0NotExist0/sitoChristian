<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOT_Exist - Spaces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00ff00; /* Verde acido */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
            cursor: pointer; /* Indica che la pagina è cliccabile */
        }

        .rave-container {
            text-align: center;
            letter-spacing: 4px;
            z-index: 3;
            user-select: none;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            animation: strobe 0.15s infinite, glitch 0.4s infinite alternate;
            text-shadow: 3px 3px 0 #ff0055, -3px -3px 0 #0000ff;
        }

        .subtitle {
            font-size: 1rem;
            margin-top: 20px;
            color: #ffffff;
            opacity: 0.8;
            animation: pulse 1s infinite steps(2);
        }

        /* Player completamente nascosto */
        #sc-hidden-player {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* KEYFRAMES */
        @keyframes glitch {
            0% { transform: skewX(-3deg) scaleY(1); letter-spacing: 4px; }
            50% { transform: skewX(5deg) scaleY(1.1); color: #ff0055; }
            100% { transform: skewX(-5deg) scaleY(0.9); letter-spacing: 6px; }
        }

        @keyframes strobe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            75% { opacity: 0.4; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="rave-container">
        <h1 class="title">Oflline Website</h1>
        <p class="subtitle" id="status-text">[ CLICK TO RELAX ]</p>
    </div>

    <!-- Player SoundCloud nascosto -->
    <iframe 
        id="sc-hidden-player"
        src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/0not_exist0&auto_play=true&html5=true">
    </iframe>

    <!-- API ufficiale SoundCloud per il controllo via JS -->
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        const iframe = document.getElementById('sc-hidden-player');
        const widget = SC.Widget(iframe);
        const statusText = document.getElementById('status-text');

        // Al primo click ovunque sullo schermo, avvia l'audio e aggiorna il testo
        document.body.addEventListener('click', () => {
            widget.play();
            statusText.innerText = "NOT_Exist // SOUND SYSTEM ONLINE";
            statusText.style.color = "#00ff00";
        }, { once: true }); // 'once: true' rimuove il listener dopo il primo click
    </script>

</body>
</html>
